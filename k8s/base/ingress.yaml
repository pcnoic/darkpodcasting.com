apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darkpodcasting-server
  labels:
    app: darkpodcasting-server
    app.kubernetes.io/name: darkpodcasting-server
    app.kubernetes.io/component: backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://trading.christos.id"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: darkpodcasting.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: darkpodcasting-server
                port:
                  number: 80
  tls:
    - hosts:
        - darkpodcasting.com
      secretName: darkpodcasting-tls
