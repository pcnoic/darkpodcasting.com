<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark - we make podcasts for real people</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10+Charted&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #000000;
            border-bottom: 1px solid #00ff00;
            padding: 20px;
            text-align: center;
            z-index: 100;
        }

        h1 {
            font-size: clamp(24px, 6vw, 48px);
            font-weight: 400;
            margin-bottom: 5px;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subheader {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(12px, 3vw, 16px);
            color: #888888;
            margin: 0;
        }

        main {
            flex: 1;
            padding: 120px 20px 80px;
            overflow-y: auto;
        }

        .podcasts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .podcast-card {
            background-color: #111111;
            border: 1px solid #00ff00;
            padding: 20px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .podcast-card:hover {
            background-color: #001100;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .podcast-card h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #00ff00;
            text-transform: uppercase;
        }

        .podcast-card .website-link {
            display: block;
            color: #888888;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        .podcast-card .website-link:hover {
            color: #00ff00;
        }

        .social-links {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: #888888;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-link:hover {
            color: #00ff00;
        }

        .social-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .jobs-section {
            text-align: center;
            margin: 40px 0 20px;
        }

        .jobs-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #111111;
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            font-weight: 400;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 14px;
        }

        .jobs-link:hover {
            background-color: #001100;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #000000;
            border-top: 1px solid #00ff00;
            padding: 15px;
            text-align: center;
            color: #888888;
            font-size: 12px;
            z-index: 100;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            main {
                padding: 100px 15px 70px;
            }

            .podcasts-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .podcast-card {
                padding: 15px;
            }

            header {
                padding: 15px;
            }

            footer {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .podcast-card h2 {
                font-size: 16px;
            }

            .jobs-link {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>
